name: Publish desktop updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows installers
    runs-on: windows-latest

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Allocate the next update version
        id: version
        shell: pwsh
        run: |
          $version = node scripts/next-release-version.cjs
          npm version $version --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$version" $env:GITHUB_SHA
          git push origin "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build installers and publish the update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\build-windows-installers.ps1 -Publish
